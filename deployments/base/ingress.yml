apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: justice-redact-frontend
  # 💡 Remove the hardcoded namespace line. Kustomize handles it globally.
  annotations:
    external-dns.alpha.kubernetes.io/aws-weight: '100'
    # 👈 Use a clean base placeholder string here
    external-dns.alpha.kubernetes.io/set-identifier: 'justice-redact-frontend-base-green'
spec:
  ingressClassName: default-non-prod
  rules:
    # 👈 Use a generic placeholder host domain for the base blueprint
    - host: placeholder.apps.live.cloud-platform.service.justice.gov.uk
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: justice-redact-frontend
                port:
                  number: 80