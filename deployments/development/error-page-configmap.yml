apiVersion: v1
kind: ConfigMap
metadata:
  name: justice-redact-error-page
  namespace: ${NAMESPACE}
data:
  403.html: |
    <!doctype html>
    <html lang="en">
      <head>
        <meta charset="utf-8">
        <meta
          name="viewport"
          content="width=device-width, initial-scale=1"
        >
        <title>You do not have access to this service - Justice Redact</title>

        <style>
          * {
            box-sizing: border-box;
          }

          html {
            min-height: 100%;
            background: #f3f2f1;
          }

          body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: #0b0c0c;
            background: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 19px;
            line-height: 1.31579;
          }

          a {
            color: #1d70b8;
            text-decoration: underline;
            text-decoration-thickness: 1px;
            text-underline-offset: 0.15em;
          }

          a:hover {
            color: #003078;
            text-decoration-thickness: 3px;
          }

          a:focus {
            color: #0b0c0c;
            background: #ffdd00;
            outline: 3px solid #ffdd00;
            box-shadow: 0 -2px #ffdd00, 0 4px #0b0c0c;
            text-decoration: none;
          }

          .width-container {
            max-width: 960px;
            margin: 0 auto;
            padding-left: 30px;
            padding-right: 30px;
          }

          .skip-link {
            position: absolute;
            left: -9999px;
            top: auto;
          }

          .skip-link:focus {
            position: static;
            display: block;
            padding: 10px 15px;
            background: #ffdd00;
            color: #0b0c0c;
            font-weight: 700;
          }

          .moj-header {
            border-top: 3px solid #d4351c;
            background: #0b0c0c;
          }

          .moj-header-container {
            min-height: 96px;
            display: flex;
            align-items: center;
          }

          .moj-header-logo {
            display: flex;
            align-items: center;
            gap: 14px;
          }

          .moj-crest {
            width: 40px;
            height: 40px;
            flex: 0 0 40px;
          }

          .moj-crest svg {
            display: block;
            width: 40px;
            height: 40px;
          }

          .moj-header-content {
            display: flex;
            align-items: baseline;
            gap: 24px;
            flex-wrap: wrap;
          }

          .moj-header-organisation,
          .moj-header-service {
            color: #ffffff;
            text-decoration: none;
          }

          .moj-header-organisation {
            font-size: 28px;
            line-height: 1;
            font-weight: 700;
          }

          .moj-header-service {
            font-size: 26px;
            line-height: 1;
            font-weight: 400;
          }

          .moj-header-organisation:hover,
          .moj-header-service:hover {
            color: #ffffff;
            text-decoration: underline;
          }

          .blue-rule {
            height: 10px;
            background: #1d70b8;
          }

          .phase-banner {
            background: #ffffff;
          }

          .phase-banner-inner {
            padding-top: 13px;
            padding-bottom: 13px;
            border-bottom: 1px solid #b1b4b6;
          }

          .phase-banner-content {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0;
          }

          .phase-tag {
            display: inline-block;
            padding: 5px 8px 4px;
            color: #0b0c0c;
            background: #bbd4ea;
            font-size: 20px;
            line-height: 1;
            font-weight: 400;
          }

          .app-content {
            flex: 1 0 auto;
            background: #ffffff;
          }

          main {
            padding-top: 55px;
            padding-bottom: 70px;
          }

          .content-column {
            max-width: 640px;
          }

          h1 {
            margin: 0 0 35px;
            font-size: 48px;
            line-height: 1.04167;
            font-weight: 700;
          }

          p {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 19px;
            line-height: 1.31579;
          }

          .footer {
            border-top: 10px solid #1d70b8;
            background: #f3f2f1;
            color: #0b0c0c;
          }

          .footer-inner {
            padding-top: 48px;
            padding-bottom: 35px;
          }

          .footer-crown {
            width: 32px;
            height: 30px;
            margin-bottom: 95px;
          }

          .footer-links {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            margin: 0 0 24px;
            padding: 0;
            list-style: none;
          }

          .footer-links a,
          .footer-meta a {
            color: #0b0c0c;
          }

          .footer-meta {
            display: flex;
            justify-content: space-between;
            gap: 30px;
            align-items: flex-end;
          }

          .footer-licence {
            max-width: 720px;
          }

          .ogl {
            display: inline-block;
            margin-right: 14px;
            font-size: 22px;
            font-weight: 700;
          }

          .copyright {
            white-space: nowrap;
          }

          @media (max-width: 720px) {
            .width-container {
              padding-left: 20px;
              padding-right: 20px;
            }

            .moj-header-container {
              min-height: 86px;
            }

            .moj-header-content {
              gap: 8px 16px;
            }

            .moj-header-organisation {
              font-size: 22px;
            }

            .moj-header-service {
              font-size: 20px;
            }

            h1 {
              font-size: 36px;
              line-height: 1.11111;
            }

            main {
              padding-top: 40px;
              padding-bottom: 55px;
            }

            .footer-crown {
              margin-bottom: 50px;
            }

            .footer-meta {
              flex-direction: column;
              align-items: flex-start;
            }
          }
        </style>
      </head>

      <body>
        <a class="skip-link" href="#main-content">
          Skip to main content
        </a>

        <header role="banner">
          <div class="moj-header">
            <div class="width-container moj-header-container">
              <div class="moj-header-logo">
                <div class="moj-crest" aria-hidden="true">
                  {{MOJ_CREST}}
                </div>

                <div class="moj-header-content">
                  <span class="moj-header-organisation">
                    Ministry of Justice
                  </span>

                  <span class="moj-header-service">
                    Justice Redact
                  </span>
                </div>
              </div>
            </div>
          </div>

          <div class="blue-rule"></div>

          <div class="phase-banner">
            <div class="width-container phase-banner-inner">
              <p class="phase-banner-content">
                <span class="phase-tag">
                  Beta
                </span>

                <span>
                  This is a new service – your
                  <a href="mailto:JusticeRedactTeam@justice.gov.uk">
                    feedback
                  </a>
                  will help us to improve it.
                </span>
              </p>
            </div>
          </div>
        </header>

        <div class="app-content">
          <div class="width-container">
            <main id="main-content">
              <div class="content-column">
                <h1>
                  You do not have access to this service
                </h1>

                <p>
                  Check that your MOJ VPN is on and try again.
                </p>

                <p>
                  If that does not work, it means you cannot access Justice Redact.
                </p>

                <p>
                  <a href="mailto:JusticeRedactTeam@justice.gov.uk">
                    Contact the Justice Redact team
                  </a>
                  if you need help.
                </p>
              </div>
            </main>
          </div>
        </div>

        <footer class="footer" role="contentinfo">
          <div class="width-container footer-inner">
            <svg
              class="footer-crown"
              aria-hidden="true"
              focusable="false"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 64 60"
              fill="currentColor"
            >
              <g>
                <circle cx="20" cy="17.6" r="3.7" />
                <circle cx="10.2" cy="23.5" r="3.7" />
                <circle cx="3.7" cy="33.2" r="3.7" />
                <circle cx="31.7" cy="30.6" r="3.7" />
                <circle cx="43.3" cy="17.6" r="3.7" />
                <circle cx="53.2" cy="23.5" r="3.7" />
                <circle cx="59.7" cy="33.2" r="3.7" />

                <path d="M33.1,9.8c.2-.1.3-.3.5-.5l4.6,2.4v-6.8l-4.6,1.5c-.1-.2-.3-.3-.5-.5l1.9-5.9h-6.7l1.9,5.9c-.2.1-.3.3-.5.5l-4.6-1.5v6.8l4.6-2.4c.1.2.3.3.5.5l-2.6,8c-.9,2.8,1.2,5.7,4.1,5.7h0c3,0,5.1-2.9,4.1-5.7l-2.6-8Z" />
              </g>
            </svg>

            <ul class="footer-links">
              <li>Accessibility</li>
              <li>Privacy</li>
              <li>Cookies</li>
              <li>
                <a href="mailto:JusticeRedactTeam@justice.gov.uk">
                  Contact
                </a>
              </li>
            </ul>

            <div class="footer-meta">
              <div class="footer-licence">
                <span class="ogl">
                  OGL
                </span>

                <span>
                  All content is available under the
                  <a
                    href="https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/"
                  >
                    Open Government Licence v3.0
                  </a>,
                  except where otherwise stated
                </span>
              </div>

              <a
                class="copyright"
                href="https://www.nationalarchives.gov.uk/information-management/re-using-public-sector-information/uk-government-licensing-framework/crown-copyright/"
              >
                © Crown copyright
              </a>
            </div>
          </div>
        </footer>
      </body>
    </html>