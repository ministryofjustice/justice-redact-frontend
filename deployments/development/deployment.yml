apiVersion: apps/v1
kind: Deployment
metadata:
  name: justice-redact-frontend

spec:
  replicas: 2
  selector:
    matchLabels:
      app: justice-redact-frontend
  template:
    metadata:
      labels:
        app: justice-redact-frontend
    spec:
      serviceAccountName: ${SERVICE_ACCOUNT}
      # This enforces non-root for the entire Pod:
      securityContext:
        runAsNonRoot: true

      containers:
        - name: app
          image: ${IMAGE}
          ports:
            - containerPort: 3000