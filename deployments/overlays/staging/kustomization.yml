apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Automatically forces all resources into the staging namespace context
namespace: justice-redact-staging

# Replaces the default service account name for staging
patchesJson6902:
  - target:
      version: v1
      kind: Deployment
      name: justice-redact-frontend
    patch: |-
      - op: replace
        path: /spec/template/spec/serviceAccountName
        value: justice-redact-staging

# Overrides the host routing target to your staging domain
patches:
  - inline: |
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: justice-redact-frontend
        annotations:
          external-dns.alpha.kubernetes.io/set-identifier: 'justice-redact-frontend-justice-redact-staging-green'
      spec:
        rules:
          - host: justice-redact-staging.apps.live.cloud-platform.service.justice.gov.uk