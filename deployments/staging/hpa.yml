apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: justice-redact-frontend

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: justice-redact-frontend

  minReplicas: 2
  maxReplicas: 6

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 1
          periodSeconds: 15

    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60