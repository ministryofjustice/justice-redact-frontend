apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Automatically forces all resources into your production namespace context
namespace: justice-redact-prod  # 👈 Replace with your exact MoJ production namespace

# Replaces the default service account name for production execution limits
patchesJson6902:
  - target:
      version: v1
      kind: Deployment
      name: justice-redact-frontend
    patch: |-
      - op: replace
        path: /spec/template/spec/serviceAccountName
        value: justice-redact-production  # 👈 Matches your production service account

# Overrides the host routing target to your live, public domain
patches:
  - target:
      version: v1
      kind: Ingress
      name: justice-redact-frontend
    patch: |-
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: justice-redact-frontend
        annotations:
          external-dns.alpha.kubernetes.io/set-identifier: 'justice-redact-frontend-justice-redact-production-green'
      spec:
        rules:
          - host: justice-redact.apps.live.cloud-platform.service.justice.gov.uk