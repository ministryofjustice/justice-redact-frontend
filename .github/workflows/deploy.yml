name: Build, Push and Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: ${{ vars.ECR_REGION }}
      REGISTRY: ${{ secrets.ECR_REGISTRY_URL }}
      REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      IMAGE_TAG: ${{ github.sha }}

      # Keep naming consistent with Terraform
      TEAM_NAME: justice-redact
      ENVIRONMENT: dev
      NAMESPACE: justice-redact-dev

    steps:
      # -------------------------------
      # Checkout code
      # -------------------------------
      - name: Checkout repository
        uses: actions/checkout@v3

      # -------------------------------
      # Authenticate to AWS (IRSA role)
      # -------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.ECR_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      # -------------------------------
      # Login to ECR
      # -------------------------------
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      # -------------------------------
      # Build and push Docker image
      # -------------------------------
      - name: Build and push Docker image
        run: |
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

      # -------------------------------
      # Generate Kubernetes manifests
      # -------------------------------
      - name: Generate Kubernetes manifests
        run: |
          sudo apt-get update && sudo apt-get install -y gettext

          mkdir -p k8s

          export IMAGE=$REGISTRY/$REPOSITORY:$IMAGE_TAG
          export SERVICE_ACCOUNT="${TEAM_NAME}-${ENVIRONMENT}"

          echo "Using service account: $SERVICE_ACCOUNT"
          echo "Using image: $IMAGE"

          envsubst < deployments/templates/deployment.yml > k8s/deployment.yml
          envsubst < deployments/templates/service.yml > k8s/service.yml
          envsubst < deployments/templates/ingress.yml > k8s/ingress.yml