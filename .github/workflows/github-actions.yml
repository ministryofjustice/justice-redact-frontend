name: 'Build, Push & Deploy'

on:
  push:
    branches:
      - dev
      - main
      - prod
      - prod

jobs:
  # JOB 1: Determine the target environment dynamically based on the Git branch
  set-environment:
    runs-on: ubuntu-latest
    outputs:
      target_env: ${{ steps.branch-check.outputs.env_name }}
    steps:
      - id: branch-check
        run: |
          if [ "${{ github.ref_name }}" = "dev" ]; then
            echo "env_name=dev" >> $GITHUB_OUTPUT
            echo "env_name=dev" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" = "main" ]; then
            echo "env_name=staging" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" = "prod" ]; then
            echo "env_name=prod" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" = "prod" ]; then
            echo "env_name=prod" >> $GITHUB_OUTPUT
          else
            echo "env_name=dev" >> $GITHUB_OUTPUT
            echo "env_name=dev" >> $GITHUB_OUTPUT
          fi

  # JOB 2: Build, Push, and Deploy using the dynamic environment context
  ecr_and_deploy:
    needs: set-environment
    runs-on: ubuntu-latest
    environment: ${{ needs.set-environment.outputs.target_env }}
    
    permissions:
      id-token: write 
      contents: read  
    
    steps:
      # 1. Checkout GitHub repository
      - uses: actions/checkout@v4

      # 2. Configure AWS credentials using OIDC
      # 💡 Fix: If target environment is staging, assume the Dev IAM role instead
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: ${{ needs.set-environment.outputs.target_env == 'staging' && secrets.ECR_ROLE_TO_ASSUME_DEV || secrets.ECR_ROLE_TO_ASSUME }}
          aws-region: ${{ needs.set-environment.outputs.target_env == 'staging' && 'eu-west-2' || vars.ECR_REGION }}

      # 3. Login to container repository
      - name: Log into ECR
        uses: aws-actions/amazon-ecr-login@v2
        id: login-ecr

      # 4. Build and push a Docker image to the shared dev registry
      - name: Build & Push to ECR
        run: |
          CLEAN_REPO=$(echo "$REPOSITORY" | sed 's|^justice-redact/||')
          docker build -t $REGISTRY/$CLEAN_REPO:node-$IMAGE_TAG .
          docker push $REGISTRY/$CLEAN_REPO:node-$IMAGE_TAG
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ needs.set-environment.outputs.target_env == 'staging' && 'justice-redact/justice-redact-dev' || vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}

      # 5. Authenticate to the cluster FIRST (Fixed Step Order)
      - name: 'Authenticate to the cluster'
        run: |
          echo "${{ secrets.KUBE_CERT }}" > ca.crt
          kubectl config set-cluster ${{ secrets.KUBE_CLUSTER }} --certificate-authority=./ca.crt --server=https://${{ secrets.KUBE_CLUSTER }}
          kubectl config set-credentials deploy-user --token=${KUBE_TOKEN}
          kubectl config set-context ${{ secrets.KUBE_CLUSTER }} --cluster=${{ secrets.KUBE_CLUSTER }} --user=deploy-user --namespace=${{ secrets.KUBE_NAMESPACE }}
          kubectl config use-context ${{ secrets.KUBE_CLUSTER }}
        env:
          KUBE_TOKEN: ${{ secrets.KUBE_TOKEN }}

      # 6. Verify cluster access (Optional debugging check)
      - name: Verify cluster access
        run: |
          kubectl get pods -n ${{ secrets.KUBE_NAMESPACE }}

      # 7. Compile & Deploy via Kustomize Overlays using the secure active context
      - name: Deploy to Kubernetes
        run: |
          # Map target environment context to the exact folder track
          if [ "${{ needs.set-environment.outputs.target_env }}" = "development" ]; then
            export TARGET_DIR="deployments/base"
          elif [ "${{ needs.set-environment.outputs.target_env }}" = "staging" ]; then
            export TARGET_DIR="deployments/overlays/staging"
          else
            export TARGET_DIR="deployments/base"
          fi

          # Change to target track directory
          cd $TARGET_DIR
          
          # 💡 FIX: Dynamically inject the active target namespace context into Kustomize
          kustomize edit set namespace ${{ secrets.KUBE_NAMESPACE }}
          
          # Set image lookup placeholder tag to point to the actual built ECR image
          kustomize edit set image justice-redact-frontend-image:latest=${REGISTRY}/${REPOSITORY}:node-${IMAGE_TAG}
          
          # Render and deploy manifests cleanly now that namespace configurations perfectly align
          kubectl apply -k .
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ needs.set-environment.outputs.target_env == 'staging' && 'justice-redact/justice-redact-dev' || vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}