name: 'Build, Push & Deploy Frontend'
 
on:
  push:
    branches:
      - dev
      - staging
      - prod
 
jobs:
  # JOB 1: Determine the target environment dynamically based on the Git branch
  set-environment:
    runs-on: ubuntu-latest
    outputs:
      target_env: ${{ steps.branch-check.outputs.env_name }}
    steps:
      - id: branch-check
        run: |
          if [ "${{ github.ref_name }}" = "dev" ]; then
            echo "env_name=dev" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" = "staging" ]; then
            echo "env_name=staging" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" = "prod" ]; then
            echo "env_name=prod" >> $GITHUB_OUTPUT
          else
            echo "env_name=dev" >> $GITHUB_OUTPUT
          fi
 
  # JOB 2: Build, Push, and Deploy using the dynamic environment context
  ecr_and_deploy:
    needs: set-environment
    runs-on: ubuntu-latest
    environment: ${{ needs.set-environment.outputs.target_env }}

    outputs:
      image_uri: ${{ steps.build.outputs.image_uri }}
 
    permissions:
      id-token: write
      contents: read
 
    env:
      KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
 
    steps:
      # 1. Checkout GitHub repository
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 #v4
 
      # 2. Configure AWS credentials using OIDC
      # 💡 Fix: If target environment is staging, assume the Dev IAM role instead
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@0d04879d366c9959065c153479c620d35e5c4097 # v3
        with:
          role-to-assume: ${{ needs.set-environment.outputs.target_env == 'staging' && secrets.ECR_ROLE_TO_ASSUME_DEV || secrets.ECR_ROLE_TO_ASSUME }}
          aws-region: ${{ needs.set-environment.outputs.target_env == 'staging' && 'eu-west-2' || vars.ECR_REGION }}
      
      # 3. Login to container repository
      - name: Log into ECR
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2
        id: login-ecr

      # 4. Build and push a Docker image to the shared dev registry
      # 💡 Fix: If target environment is staging, push directly to the dev ECR path
      - name: Build & Push to ECR
        id: build
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_BASE_URL="$NEXT_PUBLIC_API_BASE_URL" \
            -t $REGISTRY/$REPOSITORY:node-$IMAGE_TAG .
          docker push $REGISTRY/$REPOSITORY:node-$IMAGE_TAG
          echo "image_uri=$REGISTRY/$REPOSITORY:node-$IMAGE_TAG" >> "$GITHUB_OUTPUT"
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ needs.set-environment.outputs.target_env == 'staging' && 'justice-redact/justice-redact-dev' || vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}

      # 5. Generate Kubernetes manifests dynamically with environment folder mapping
      # 💡 Fix: Match staging images back to the shared dev ECR naming convention
      - name: Generate Kubernetes manifests
        run: |
          sudo apt-get update && sudo apt-get install -y gettext
          mkdir -p k8s

          if [ "${{ needs.set-environment.outputs.target_env }}" = "dev" ]; then
            export ENV_FOLDER="development"
          elif [ "${{ needs.set-environment.outputs.target_env }}" = "staging" ]; then
            export ENV_FOLDER="staging"
          else
            export ENV_FOLDER="production"
          fi

          CLEAN_REPO=$(echo "$REPOSITORY" | sed 's|^justice-redact/||')
          export ENVIRONMENT="${{ needs.set-environment.outputs.target_env }}"
          export TEAM_NAME=justice-redact
          export NAMESPACE="${{ secrets.KUBE_NAMESPACE }}" 
          export IMAGE="${REGISTRY}/${REPOSITORY}:node-${IMAGE_TAG}"
          export SERVICE_ACCOUNT="cd-serviceaccount"

          if [ "${ENVIRONMENT}" = "prod" ]; then
            export INGRESS_CLASS="default"
          else
            export INGRESS_CLASS="default-non-prod"
          fi

          echo "=== Current working directory structure ==="
          ls -R deployments/ || echo "deployments directory not found!"

          export TEMPLATE_DIR="deployments/${ENV_FOLDER}"

          echo "Using templates from ${TEMPLATE_DIR}"
          ls -la ${TEMPLATE_DIR}

          echo "ENV_FOLDER=$ENV_FOLDER"
          echo "TEMPLATE_DIR=$TEMPLATE_DIR"
          echo "IMAGE=$IMAGE"
          echo "SERVICE_ACCOUNT=$SERVICE_ACCOUNT"
          echo "NAMESPACE=$NAMESPACE"
          echo "ENVIRONMENT=$ENVIRONMENT"

          envsubst < ${TEMPLATE_DIR}/deployment.yml > k8s/deployment.yml
          envsubst < ${TEMPLATE_DIR}/service.yml > k8s/service.yml
          envsubst < ${TEMPLATE_DIR}/ingress.yml > k8s/ingress.yml
          echo "=== Generated ingress ==="
          cat k8s/ingress.yml
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ needs.set-environment.outputs.target_env == 'staging' && 'justice-redact/justice-redact-dev' || vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
 
      # 6. Authenticate to the cluster using Kube Token
      - name: Authenticate to the cluster
        env:
          KUBE_CERT: ${{ secrets.KUBE_CERT }}
          KUBE_TOKEN: ${{ secrets.KUBE_TOKEN }}
          KUBE_CLUSTER: ${{ secrets.KUBE_CLUSTER }}
        run: |
          echo "${KUBE_CERT}" > ca.crt
          kubectl config set-cluster ${KUBE_CLUSTER} --certificate-authority=./ca.crt --server=https://${KUBE_CLUSTER}
          kubectl config set-credentials deploy-user --token=${KUBE_TOKEN}
          kubectl config set-context ${KUBE_CLUSTER} --cluster=${KUBE_CLUSTER} --user=deploy-user --namespace=${KUBE_NAMESPACE}
          kubectl config use-context ${KUBE_CLUSTER}
 
      # 7. Validate Kubernetes manifests against live cluster schemas
      - name: Validate Kubernetes Manifests
        run: |
          kubectl apply --filename=k8s/ --dry-run=client
 
      # 8. Verify cluster access
      - name: Verify cluster access
        run: |
          kubectl get pods -n ${KUBE_NAMESPACE}
 
      # 9. Deploy to Kubernetes
      - name: Deploy to Kubernetes
        run: |
          kubectl apply --filename=k8s/ --namespace=${KUBE_NAMESPACE}

      # 10. Debug frontend service
      - name: Debug frontend service
        if: failure()
        run: |
          echo "=== Pods ==="
          kubectl get pods -n ${KUBE_NAMESPACE} -o wide

          echo "=== Services ==="
          kubectl get svc -n ${KUBE_NAMESPACE}

          echo "=== Endpoints ==="
          kubectl describe svc justice-redact-frontend -n ${KUBE_NAMESPACE} || true

          echo "=== Frontend Service ==="
          kubectl describe svc justice-redact-frontend -n ${KUBE_NAMESPACE}
      
      # 11. Debug ingress
      - name: Debug ingress
        if: failure()
        run: |
          echo "=== Ingress ==="
          kubectl get ingress -n ${KUBE_NAMESPACE}
          echo ""
          kubectl describe ingress justice-redact-frontend -n ${KUBE_NAMESPACE}

  # JOB 3: Snyk container + code scan against the image just pushed
  sast:
    name: Run SaST tooling
    needs: [set-environment, ecr_and_deploy]
    # Pinned to latest main as of 30 Jul 2026 — refresh periodically with:
    # git ls-remote https://github.com/ministryofjustice/laa-reusable-github-actions main
    uses: ministryofjustice/laa-reusable-github-actions/.github/workflows/sast.yml@932ee576d65d9992ca82955a5823e3d55e888417
    permissions:
      actions: read
      id-token: write
      contents: read
      security-events: write
    with:
      image_uri: ${{ needs.ecr_and_deploy.outputs.image_uri }}
      dockerfile_path: Dockerfile
      minimum_threshold: high
    secrets:
      SNYK_CLIENT_ID: ${{ secrets.SNYK_CLIENT_ID }}
      SNYK_CLIENT_SECRET: ${{ secrets.SNYK_CLIENT_SECRET }}
      # Mirrors the same staging-uses-dev-role quirk as the build job above
      ECR_ROLE_TO_ASSUME: ${{ needs.set-environment.outputs.target_env == 'staging' && secrets.ECR_ROLE_TO_ASSUME_DEV || secrets.ECR_ROLE_TO_ASSUME }}