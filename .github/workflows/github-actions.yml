name: 'Build, Push & Deploy'

on:
  push:
    branches:
      - dev
      - main  # Used for staging / tracking production releases

jobs:
  # JOB 1: Determine the target environment dynamically based on the Git branch
  set-environment:
    runs-on: ubuntu-latest
    outputs:
      target_env: ${{ steps.branch-check.outputs.env_name }}
    steps:
      - id: branch-check
        run: |
          if [ "${{ github.ref_name }}" = "dev" ]; then
            echo "env_name=development" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" = "main" ]; then
            # You can change this logic to "production" if you switch to deployment tags later
            echo "env_name=staging" >> $GITHUB_OUTPUT
          else
            echo "env_name=development" >> $GITHUB_OUTPUT
          fi

  # JOB 2: Build, Push, and Deploy using the dynamic environment context
  ecr_and_deploy:
    needs: set-environment
    runs-on: ubuntu-latest
    # This line tells GitHub which environment block to pull secrets from!
    environment: ${{ needs.set-environment.outputs.target_env }}
    
    permissions:
      id-token: write 
      contents: read  
    
    steps:
      # 1. Checkout GitHub repository
      - uses: actions/checkout@v4

      # 2. Configure AWS credentials using OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: ${{ secrets.ECR_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.ECR_REGION }}

      # 3. Login to container repository
      - name: Log into ECR
        uses: aws-actions/amazon-ecr-login@v2
        id: login-ecr

      # 4. Build and push a Docker image
      - name: Build & Push to ECR
        run: |
          docker build -t $REGISTRY/$REPOSITORY:node-$IMAGE_TAG .
          docker push $REGISTRY/$REPOSITORY:node-$IMAGE_TAG
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}

      # 5. Generate Kubernetes manifests dynamically based on current environment
      - name: Generate Kubernetes manifests
        run: |
          sudo apt-get update && sudo apt-get install -y gettext
          mkdir -p k8s

          # 1. Map target environment tags
          if [ "${{ needs.set-environment.outputs.target_env }}" = "development" ]; then
            export ENV_FOLDER="development"
            export ENVIRONMENT="dev"
          elif [ "${{ needs.set-environment.outputs.target_env }}" = "staging" ]; then
            export ENV_FOLDER="staging"
            export ENVIRONMENT="staging"
          else
            export ENV_FOLDER="production"
            export ENVIRONMENT="prod"
          fi

          export TEAM_NAME=justice-redact
          export NAMESPACE="${{ secrets.KUBE_NAMESPACE }}" 
          export IMAGE="${REGISTRY}/${REPOSITORY}:node-${IMAGE_TAG}"
          export SERVICE_ACCOUNT="${TEAM_NAME}-${ENVIRONMENT}"

          # 2. Debugging Step: Output active directory contents so you can see why it fails
          echo "=== Current working directory structure ==="
          ls -R deployments/ || echo "deployments directory not found!"

          # 3. Define template target base directory
          # ADJUST THIS PATH if your templates live deeper (e.g., "deployments/overlays/${ENV_FOLDER}")
          export TEMPLATE_DIR="deployments/${ENV_FOLDER}"

          # 4. Substitute and output manifests
          envsubst < ${TEMPLATE_DIR}/deployment.yml > k8s/deployment.yml
          envsubst < ${TEMPLATE_DIR}/service.yml > k8s/service.yml
          envsubst < ${TEMPLATE_DIR}/ingress.yml > k8s/ingress.yml
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}

      # 6. Authenticate to the cluster using Environment-specific cluster secrets
      - name: 'Authenticate to the cluster'
        run: |
          echo "${{ secrets.KUBE_CERT }}" > ca.crt
          kubectl config set-cluster ${{ secrets.KUBE_CLUSTER }} --certificate-authority=./ca.crt --server=https://${{ secrets.KUBE_CLUSTER }}
          kubectl config set-credentials deploy-user --token=${{ secrets.KUBE_TOKEN }}
          kubectl config set-context ${{ secrets.KUBE_CLUSTER }} --cluster=${{ secrets.KUBE_CLUSTER }} --user=deploy-user --namespace=${{ secrets.KUBE_NAMESPACE }}
          kubectl config use-context ${{ secrets.KUBE_CLUSTER }}

      # 7. Verify cluster access
      - name: Verify cluster access
        run: |
          kubectl get pods -n ${{ secrets.KUBE_NAMESPACE }}

      #####

      # 8. Deploy compiled configs to Kubernetes
      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/ -n ${{ secrets.KUBE_NAMESPACE }}
