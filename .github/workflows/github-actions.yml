on:
  push:
    branches: [main]

jobs:
  ecr:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # This is required for requesting the JWT
      contents: read  # This is required for actions/checkout
    steps:
      # Checkout GitHub repository
      - uses: actions/checkout@v3

      # Assume role in Cloud Platform
      - uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.ECR_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.ECR_REGION }}

      # Login to container repository
      - uses: aws-actions/amazon-ecr-login@v1
        id: login-ecr

      # Build and push a Docker image to the container repository
      - run: |
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
        env:
          REGISTRY: ${{ secrets.ECR_REGISTRY_URL }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}

      - name: Generate Kubernetes manifests
        run: |
          sudo apt-get update && sudo apt-get install -y gettext

          mkdir -p k8s

          export IMAGE=$REGISTRY/$REPOSITORY:$IMAGE_TAG
          export TEAM_NAME=justice-redact
          export ENVIRONMENT=dev
          export SERVICE_ACCOUNT="${TEAM_NAME}-${ENVIRONMENT}"

          envsubst < deployments/templates/deployment.yml > k8s/deployment.yml
          envsubst < deployments/templates/service.yml > k8s/service.yml
          envsubst < deployments/templates/ingress.yml > k8s/ingress.yml
        env:
          REGISTRY: ${{ secrets.ECR_REGISTRY_URL }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}

      # ✅ Deploy step (if you have kubeconfig)
      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ${{ vars.ECR_REGION }} \
            --name live.cloud-platform.service.justice.gov.uk
            
      - name: Verify cluster access
        run: |
          kubectl get nodes

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -n justice-redact-dev -f k8s/
