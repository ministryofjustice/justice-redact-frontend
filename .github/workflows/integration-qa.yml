name: 'Integration QA (PR Preview)'

on:
  pull_request:
    types:
      - converted_to_draft
      - opened
      - ready_for_review
      - reopened
      - synchronize

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  # ==========================================
  # JOB 1: Check if PR is a Draft
  # ==========================================
  eligibility:
    name: Determine eligibility
    if: github.event.pull_request.base.ref == 'dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      eligible: ${{ steps.eligible.outputs.result }}
    steps:
      - name: Get draft PRs
        id: get-draft-prs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo 'result<<EOF'
            gh pr list --repo ministryofjustice/justice-redact-frontend --draft --state open --json number || echo '[]'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Verify PR status
        id: eligible
        uses: actions/github-script@v7
        with:
          script: |
            const raw = `${{ steps.get-draft-prs.outputs.result }}`.trim() || '[]';
            const draftPRs = JSON.parse(raw).map(pr => pr.number);
            return !draftPRs.includes(${{ github.event.pull_request.number }});

  # ==========================================
  # JOB 2: Build & Deploy to Dev (Only if Ready for Review)
  # ==========================================
  ecr_and_deploy_qa:
    name: Build & Deploy PR to Dev
    needs: [eligibility]
    if: ${{ needs.eligibility.outputs.eligible == 'true' }}
    runs-on: ubuntu-latest
    environment: dev

    env:
      KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}

    steps:
      # 1. Checkout GitHub repository
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 #v4

      # 2. Configure AWS credentials using OIDC for Dev
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@0d04879d366c9959065c153479c620d35e5c4097 # v3
        with:
          role-to-assume: ${{ secrets.ECR_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.ECR_REGION }}
      
      # 3. Login to ECR
      - name: Log into ECR
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2
        id: login-ecr

      # 4. Build and push Docker image with QA commit tag
      - name: Build & Push to ECR
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_BASE_URL="$NEXT_PUBLIC_API_BASE_URL" \
            -t $REGISTRY/$REPOSITORY:node-$IMAGE_TAG .
          docker push $REGISTRY/$REPOSITORY:node-$IMAGE_TAG
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: qa-${{ github.sha }}
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}

      # 5. Generate Kubernetes manifests using your development template
      - name: Generate Kubernetes manifests
        run: |
          sudo apt-get update && sudo apt-get install -y gettext
          mkdir -p k8s

          export ENV_FOLDER="development"
          export ENVIRONMENT="dev"
          export TEAM_NAME=justice-redact
          export NAMESPACE="${{ secrets.KUBE_NAMESPACE }}" 
          export IMAGE="${REGISTRY}/${REPOSITORY}:node-${IMAGE_TAG}"
          export SERVICE_ACCOUNT="cd-serviceaccount"
          export INGRESS_CLASS="default-non-prod"
          export TEMPLATE_DIR="deployments/${ENV_FOLDER}"

          envsubst < ${TEMPLATE_DIR}/deployment.yml > k8s/deployment.yml
          envsubst < ${TEMPLATE_DIR}/service.yml > k8s/service.yml
          envsubst < ${TEMPLATE_DIR}/ingress.yml > k8s/ingress.yml
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: qa-${{ github.sha }}
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}

      # 6. Authenticate to the cluster
      - name: Authenticate to the cluster
        env:
          KUBE_CERT: ${{ secrets.KUBE_CERT }}
          KUBE_TOKEN: ${{ secrets.KUBE_TOKEN }}
          KUBE_CLUSTER: ${{ secrets.KUBE_CLUSTER }}
        run: |
          echo "${KUBE_CERT}" > ca.crt
          kubectl config set-cluster ${KUBE_CLUSTER} --certificate-authority=./ca.crt --server=https://${KUBE_CLUSTER}
          kubectl config set-credentials deploy-user --token=${KUBE_TOKEN}
          kubectl config set-context ${KUBE_CLUSTER} --cluster=${KUBE_CLUSTER} --user=deploy-user --namespace=${KUBE_NAMESPACE}
          kubectl config use-context ${KUBE_CLUSTER}

      # 7. Deploy to Kubernetes
      - name: Deploy to Kubernetes
        run: |
          kubectl apply --filename=k8s/ --namespace=${KUBE_NAMESPACE}