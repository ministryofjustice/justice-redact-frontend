apiVersion: apps/v1
kind: Deployment
metadata:
  name: justice-redact-frontend
  namespace: ${NAMESPACE}
spec:
  replicas: 2
  selector:
    matchLabels:
      app: justice-redact-frontend
  template:
    metadata:
      labels:
        app: justice-redact-frontend
    spec:
      containers:
        - name: app
          image: $[IMAGE]
          ports:
            - containerPort: 3000
